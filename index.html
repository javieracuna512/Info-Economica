<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cierre Económico Diario · Perú</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080e18;--surface:#0d1623;--surface2:#111d2e;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8edf5;--muted:#6b7d96;--green:#00e5a0;--gold:#f5c842;--orange:#ff7b3a;--blue:#4a9eff;--red:#ff4d6a;--purple:#a78bfa;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
  .shell{max-width:540px;margin:0 auto;padding:16px 14px 50px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:0.5px solid var(--border);}
  .logo{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .logo span{color:var(--green);}
  .clock{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .hcard{background:linear-gradient(135deg,#0f1e35,#0d1623);border:0.5px solid var(--border2);border-radius:14px;padding:18px 20px 16px;margin-bottom:12px;position:relative;overflow:hidden;}
  .hcard::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(0,229,160,0.07),transparent 70%);pointer-events:none;}
  .eyebrow{font-size:9px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-family:var(--mono);}
  .hdate{font-size:24px;font-weight:600;color:var(--text);line-height:1.15;margin-bottom:2px;}
  .hmeta{font-size:11px;color:var(--muted);margin-top:6px;}
  .hbadge{display:inline-block;font-size:9px;font-family:var(--mono);letter-spacing:1px;padding:3px 8px;border-radius:4px;margin-top:8px;}
  .b-live{background:rgba(0,229,160,0.12);color:var(--green);}
  .sec{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .stitle{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-family:var(--mono);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .src-badge{font-size:8px;letter-spacing:.5px;padding:2px 6px;border-radius:3px;background:rgba(74,158,255,.1);color:var(--blue);border:.5px solid rgba(74,158,255,.2);text-transform:none;letter-spacing:0;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
  .mlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-family:var(--mono);}
  .mval{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.1;color:var(--text);}
  .mval.sm{font-size:15px;}
  .mval.green{color:var(--green);}
  .mval.gold{color:var(--gold);}
  .mval.orange{color:var(--orange);}
  .mval.blue{color:var(--blue);}
  .msub{font-size:10px;color:var(--muted);margin-top:3px;}
  .pill{display:inline-block;font-size:9px;font-family:var(--mono);letter-spacing:.5px;padding:2px 7px;border-radius:3px;margin-top:5px;}
  .p-green{background:rgba(0,229,160,.1);color:var(--green);}
  .p-gold{background:rgba(245,200,66,.1);color:var(--gold);}
  .p-orange{background:rgba(255,123,58,.1);color:var(--orange);}
  .p-blue{background:rgba(74,158,255,.1);color:var(--blue);}
  .p-muted{background:rgba(107,125,150,.12);color:var(--muted);}
  .delta{font-size:11px;font-family:var(--mono);margin-left:5px;}
  .up{color:var(--green);}
  .dn{color:var(--red);}
  .flat{color:var(--muted);}
  .tasarow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .tasabig{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--blue);}
  .bvl-table{width:100%;border-collapse:collapse;font-size:12px;}
  .bvl-table th{font-size:9px;font-family:var(--mono);letter-spacing:1px;color:var(--muted);text-transform:uppercase;text-align:left;padding:0 6px 8px;border-bottom:0.5px solid var(--border2);}
  .bvl-table th.r{text-align:right;}
  .bvl-table td{padding:8px 6px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle;}
  .bvl-table tr:last-child td{border-bottom:none;}
  .ticker{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--gold);}
  .bname{font-size:10px;color:var(--muted);margin-top:1px;}
  .bprice{font-family:var(--mono);font-size:13px;font-weight:700;}
  .bchg{font-family:var(--mono);font-size:12px;font-weight:700;}
  .bchg.up{color:var(--green);}
  .bchg.dn{color:var(--red);}
  .fuel-wrap{margin-bottom:12px;}
  .fuel-region{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;margin-bottom:10px;padding:3px 8px;background:rgba(255,255,255,.03);border-radius:4px;display:inline-block;}
  .cmsg{text-align:center;padding:60px 20px;}
  .spin{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .msgtxt{font-size:13px;color:var(--muted);}
  .msgtxt2{font-size:11px;color:var(--muted);margin-top:6px;}
  .ebox{background:rgba(255,77,106,.06);border:.5px solid rgba(255,77,106,.25);border-radius:10px;padding:16px;color:var(--red);font-size:13px;line-height:1.7;margin-bottom:10px;}
  .warn-box{background:rgba(245,200,66,.05);border:.5px solid rgba(245,200,66,.2);border-radius:8px;padding:10px 14px;font-size:11px;color:#c8b060;margin-bottom:10px;line-height:1.5;}
  .last-update{font-size:10px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:10px;}
  .nbtn{background:var(--surface);border:0.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 13px;cursor:pointer;transition:background .15s;}
  .nbtn:hover{background:var(--surface2);}
  .nbtn.ref{background:rgba(0,229,160,0.1);border-color:rgba(0,229,160,0.3);color:var(--green);font-size:10px;padding:4px 10px;}
  .src-list{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.8;}
  .src-list a{color:var(--blue);text-decoration:none;}
  .footer{text-align:center;padding:14px 0 0;font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.5px;}
  @media(max-width:400px){.g3{grid-template-columns:1fr 1fr;}.g4{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo">CIERRE ECO · <span>PERÚ</span></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div id="app"></div>
  <div class="footer">100% gratuito · fuentes públicas · BCRP · Yahoo Finance · ExchangeRate-API</div>
</div>
<script>
// ─────────────────────────────────────────────────────
// CIERRE ECONÓMICO DIARIO · PERÚ
// Versión 100% gratuita — sin IA — sin API keys
// Fuentes: BCRP oficial, Yahoo Finance, Frankfurter,
//          open.er-api.com (todas públicas y gratis)
// ─────────────────────────────────────────────────────

const PROXY = 'https://api.allorigins.win/raw?url=';
const PFX = 'ceco2_', IDX = 'ceco2_idx';

// ── CLOCK
function pad(n){return String(n).padStart(2,'0');}
function tick(){const n=new Date(),el=document.getElementById('clock');if(el)el.textContent=pad(n.getHours())+':'+pad(n.getMinutes());}
setInterval(tick,1000);tick();

// ── STORAGE (localStorage — historial diario por dispositivo)
function saveDay(k,d){try{localStorage.setItem(PFX+k,JSON.stringify(d));}catch{}let i=[];try{i=JSON.parse(localStorage.getItem(IDX)||'[]');}catch{}if(!i.includes(k)){i.push(k);i.sort();}try{localStorage.setItem(IDX,JSON.stringify(i));}catch{}}
function loadDay(k){try{const r=localStorage.getItem(PFX+k);return r?JSON.parse(r):null;}catch{return null;}}
function allStored(){try{return JSON.parse(localStorage.getItem(IDX)||'[]');}catch{return[];}}
function delDay(k){try{localStorage.removeItem(PFX+k);}catch{}let i=[];try{i=JSON.parse(localStorage.getItem(IDX)||'[]');}catch{}i=i.filter(x=>x!==k);try{localStorage.setItem(IDX,JSON.stringify(i));}catch{}}

// ── DATE
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(k){if(!k)return'';const[y,m,d]=k.split('-').map(Number);const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return dias[new Date(y,m-1,d).getDay()]+' '+d+' de '+meses[m-1]+', '+y;}

// ── HELPERS
function dlt(cur,prv,dec){dec=dec||3;if(prv==null||isNaN(+prv)||isNaN(+cur))return'';const d=parseFloat(cur)-parseFloat(prv);const s=d>0?'+':'';const c=d>0?'up':d<0?'dn':'flat';return'<span class="delta '+c+'">'+s+d.toFixed(dec)+'</span>';}
function pill(t,c){return'<span class="pill p-'+c+'">'+t+'</span>';}

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function fetchProxy(url){
  return fetchJSON(PROXY + encodeURIComponent(url));
}

// ──────────────────────────────────────────────
// 1. DÓLAR · BCRP oficial (estadisticas.bcrp.gob.pe)
// ──────────────────────────────────────────────
async function getDolarBCRP(){
  try{
    // Series BCRP: PD04640PD=compra, PD04641PD=venta (USD/PEN)
    const url='https://estadisticas.bcrp.gob.pe/estadisticas/series/api/PD04640PD-PD04641PD/json/1/1';
    const d=await fetchProxy(url);
    const p=d?.periods;
    if(p && p.length){
      const lat=p[p.length-1];
      return {compra:parseFloat(lat.values[0]).toFixed(3), venta:parseFloat(lat.values[1]).toFixed(3), fuente:'BCRP oficial'};
    }
  }catch(e){console.warn('BCRP series falló',e);}
  // Fallback: open.er-api (gratuito, sin key)
  try{
    const d=await fetchJSON('https://open.er-api.com/v6/latest/USD');
    if(d?.rates?.PEN){
      const mid=d.rates.PEN;
      return {compra:(mid-0.015).toFixed(3), venta:(mid+0.015).toFixed(3), fuente:'ExchangeRate-API'};
    }
  }catch(e){console.warn('open.er-api falló',e);}
  return {compra:'—', venta:'—', fuente:'no disponible'};
}

// ──────────────────────────────────────────────
// 2. EURO / PEN · Frankfurter (Banco Central Europeo)
// ──────────────────────────────────────────────
async function getEuroPEN(){
  try{
    const d=await fetchJSON('https://api.frankfurter.app/latest?from=EUR&to=PEN');
    if(d?.rates?.PEN) return {valor:d.rates.PEN.toFixed(3), fuente:'Frankfurter / BCE'};
  }catch(e){}
  try{
    const d=await fetchJSON('https://open.er-api.com/v6/latest/EUR');
    if(d?.rates?.PEN) return {valor:d.rates.PEN.toFixed(3), fuente:'ExchangeRate-API'};
  }catch(e){}
  return {valor:'—', fuente:'no disponible'};
}

// ──────────────────────────────────────────────
// 3. TASA BCRP (valor oficial — actualización mensual)
// ──────────────────────────────────────────────
function getTasaBCRP(){
  // Fuente: https://www.bcrp.gob.pe/politica-monetaria/tasa-de-interes-de-referencia.html
  // Tasa vigente desde Febrero 2025: 4.75%
  return {tasa:'4.75', nota:'vigente desde feb 2025 · bcrp.gob.pe'};
}

// ──────────────────────────────────────────────
// 4. METALES Y PETRÓLEO · Yahoo Finance (libre, ~15min delay)
// ──────────────────────────────────────────────
async function getMetales(){
  const result={oro:'—',plata:'—',cobre:'—',brent:'—',oro_prev:null,plata_prev:null,cobre_prev:null};
  try{
    const sym='GC%3DF%2CSI%3DF%2CHG%3DF%2CBZ%3DF'; // GC=F, SI=F, HG=F, BZ=F
    const url=`https://query1.finance.yahoo.com/v8/finance/spark?symbols=${sym}&range=2d&interval=1d`;
    const d=await fetchProxy(url);
    const spark=d?.spark?.result;
    if(spark){
      spark.forEach(item=>{
        const closes=item.response?.[0]?.indicators?.quote?.[0]?.close;
        if(!closes||!closes.length) return;
        const last=closes[closes.length-1];
        const prev=closes.length>1?closes[closes.length-2]:null;
        if(item.symbol==='GC=F'){result.oro=last.toFixed(0);result.oro_prev=prev?prev.toFixed(0):null;}
        if(item.symbol==='SI=F'){result.plata=last.toFixed(2);result.plata_prev=prev?prev.toFixed(2):null;}
        if(item.symbol==='HG=F'){result.cobre=last.toFixed(3);result.cobre_prev=prev?prev.toFixed(3):null;}
        if(item.symbol==='BZ=F'){result.brent=last.toFixed(2);}
      });
    }
  }catch(e){console.warn('Yahoo metales falló',e);}
  return result;
}

// ──────────────────────────────────────────────
// 5. BVL · Yahoo Finance (acciones listadas en Lima)
// ──────────────────────────────────────────────
async function getBVL(){
  const tickers=[
    {sym:'BAP',        nombre:'Credicorp',          sector:'Financiero'},
    {sym:'CVERDEC1.LM',nombre:'Cerro Verde',         sector:'Minero'},
    {sym:'BUENAVC1.LM',nombre:'Buenaventura',        sector:'Minero'},
    {sym:'ALICORC1.LM',nombre:'Alicorp',              sector:'Consumo'},
    {sym:'FERREYC1.LM',nombre:'Ferreycorp',           sector:'Industrial'},
    {sym:'VOLCAAC1.LM',nombre:'Volcan Cia Minera',    sector:'Minero'},
  ];
  const rows=[];
  try{
    const syms=tickers.map(t=>encodeURIComponent(t.sym)).join('%2C');
    const url=`https://query1.finance.yahoo.com/v8/finance/spark?symbols=${syms}&range=2d&interval=1d`;
    const d=await fetchProxy(url);
    const spark=d?.spark?.result;
    if(spark){
      spark.forEach(item=>{
        const closes=item.response?.[0]?.indicators?.quote?.[0]?.close;
        if(!closes||!closes.length) return;
        const last=closes[closes.length-1];
        const prev=closes.length>1?closes[closes.length-2]:null;
        const chg=prev?((last-prev)/prev*100):0;
        const meta=tickers.find(t=>t.sym===item.symbol)||{nombre:item.symbol,sector:'—'};
        rows.push({
          ticker:item.symbol.replace('.LM',''),
          nombre:meta.nombre,
          sector:meta.sector,
          precio:last.toFixed(2),
          cambio_pct:chg.toFixed(2)
        });
      });
      rows.sort((a,b)=>parseFloat(b.cambio_pct)-parseFloat(a.cambio_pct));
    }
  }catch(e){console.warn('Yahoo BVL falló',e);}
  return rows.slice(0,5);
}

// ──────────────────────────────────────────────
// FETCH COMPLETO DEL DÍA
// ──────────────────────────────────────────────
async function fetchDay(dateKey){
  setLoading('Obteniendo tipo de cambio BCRP…');
  const dolar=await getDolarBCRP();

  setLoading('Obteniendo Euro/PEN (BCE)…');
  const euro=await getEuroPEN();

  const tasa=getTasaBCRP();

  setLoading('Obteniendo metales y petróleo (Yahoo Finance)…');
  const metales=await getMetales();

  setLoading('Obteniendo acciones BVL (Yahoo Finance)…');
  const bvl=await getBVL();

  return {
    _date:dateKey,
    _fetched:new Date().toISOString(),
    dolar_compra:dolar.compra,
    dolar_venta:dolar.venta,
    dolar_fuente:dolar.fuente,
    euro_pen:euro.valor,
    euro_fuente:euro.fuente,
    tasa_bcrp:tasa.tasa,
    tasa_nota:tasa.nota,
    oro:metales.oro,
    oro_prev:metales.oro_prev,
    plata:metales.plata,
    plata_prev:metales.plata_prev,
    cobre:metales.cobre,
    cobre_prev:metales.cobre_prev,
    brent:metales.brent,
    bvl_top5:bvl,
  };
}

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function renderBvl5(rows){
  if(!rows||!rows.length)return'<div style="font-size:12px;color:var(--muted);padding:8px 0">Sin datos BVL disponibles en este momento.</div>';
  return'<table class="bvl-table"><thead><tr><th>Acción</th><th>Precio</th><th class="r">Var. %</th></tr></thead><tbody>'+
    rows.map(r=>{
      const chg=parseFloat(r.cambio_pct)||0;
      const up=chg>=0;
      return'<tr><td><div class="ticker">'+r.ticker+'</div><div class="bname">'+r.nombre+' · '+r.sector+'</div></td>'+
        '<td><span class="bprice">'+r.precio+'</span></td>'+
        '<td style="text-align:right"><span class="bchg '+(up?'up':'dn')+'">'+(up?'+':'')+chg.toFixed(2)+'%</span></td></tr>';
    }).join('')+'</tbody></table>';
}

function renderData(d){
  const fetched=d._fetched?new Date(d._fetched).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}):'—';
  return`
    <div class="hcard">
      <div class="eyebrow">Cierre Económico Diario · Perú</div>
      <div class="hdate">${fmtDate(d._date)}</div>
      <div class="hmeta">BCRP · Yahoo Finance · Frankfurter · 100% gratuito</div>
      <span class="hbadge b-live">● EN VIVO</span>
    </div>

    <div class="last-update">
      Actualizado: ${fetched}
      <button class="nbtn ref" onclick="doRefresh()">↻ Actualizar</button>
    </div>

    <div class="sec">
      <div class="stitle">Tipo de cambio <span class="src-badge">${d.dolar_fuente||'BCRP'}</span></div>
      <div class="g3">
        <div>
          <div class="mlabel">USD compra</div>
          <div class="mval sm green">S/ ${d.dolar_compra}</div>
          <div class="msub">interbancario</div>
        </div>
        <div>
          <div class="mlabel">USD venta</div>
          <div class="mval sm blue">S/ ${d.dolar_venta}</div>
          <div class="msub">interbancario</div>
        </div>
        <div>
          <div class="mlabel">EUR / PEN</div>
          <div class="mval sm">S/ ${d.euro_pen}</div>
          <div class="msub">${d.euro_fuente||'BCE'}</div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="stitle">Tasa de interés · BCRP <span class="src-badge">bcrp.gob.pe</span></div>
      <div class="tasarow">
        <div class="tasabig">${d.tasa_bcrp}%</div>
        <div>
          <div class="mlabel">Tasa de referencia</div>
          <div class="msub">${d.tasa_nota}</div>
          ${pill('Banco Central de Reserva del Perú','blue')}
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="stitle">Metales · Futuros <span class="src-badge">Yahoo Finance · ~15min delay</span></div>
      <div class="g3">
        <div>
          <div class="mlabel">Cobre</div>
          <div class="mval">$${d.cobre}${dlt(d.cobre,d.cobre_prev,3)}</div>
          <div class="msub">USD / libra · HG=F</div>
        </div>
        <div>
          <div class="mlabel">Oro</div>
          <div class="mval gold">$${Number(d.oro||0).toLocaleString('es-PE')}${dlt(d.oro,d.oro_prev,0)}</div>
          <div class="msub">USD / oz troy · GC=F</div>
        </div>
        <div>
          <div class="mlabel">Plata</div>
          <div class="mval">$${d.plata}${dlt(d.plata,d.plata_prev,2)}</div>
          <div class="msub">USD / oz troy · SI=F</div>
        </div>
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:.5px solid var(--border)">
        <span class="mlabel">Petróleo Brent</span>
        <span class="mval sm gold" style="margin-left:8px">$${d.brent} USD/bbl</span>
        <span class="msub" style="display:inline;margin-left:6px">BZ=F · futuros</span>
      </div>
    </div>

    <div class="sec">
      <div class="stitle">Combustibles · Osinergmin <span class="src-badge">referencial</span></div>
      <div class="warn-box">
        ℹ️ Osinergmin no tiene API pública en tiempo real. Los valores son <b>referencias de mercado</b>.
        Para el precio exacto: <a href="https://www.osinergmin.gob.pe/precios/gasolinas" target="_blank">osinergmin.gob.pe</a>
      </div>
      <div class="fuel-wrap">
        <div class="fuel-region">📍 Lima (referencial)</div>
        <div class="g4">
          <div><div class="mlabel">G. Premium</div><div class="mval sm orange">~S/24.0</div><div class="msub">por galón</div></div>
          <div><div class="mlabel">G. Regular</div><div class="mval sm orange">~S/20.8</div><div class="msub">por galón</div></div>

// ESTADO Y CICLO PRINCIPAL
// ──────────────────────────────────────────────
function setHTML(h){document.getElementById('app').innerHTML=h;}
function setLoading(m){
  setHTML('<div class="cmsg"><div class="spin"></div><div class="msgtxt">'+m+'</div><div class="msgtxt2">Consultando fuentes públicas gratuitas…</div></div>');
}

async function doRefresh(){
  delDay(todayKey());
  await init();
}

async function init(){
  setLoading('Iniciando…');
  const today=todayKey();
  let cached=loadDay(today);
  if(!cached){
    try{
      cached=await fetchDay(today);
      saveDay(today,cached);
    }catch(e){
      setHTML('<div class="ebox"><b>Error al obtener datos:</b><br>'+e.message+'<br><br><button class="nbtn ref" onclick="doRefresh()" style="margin-top:10px">↻ Reintentar</button></div>');
      return;
    }
  }
  setHTML(renderData(cached));
}

init();
</script>
